<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="薪資出勤">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>薪資出勤</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f4f6}
header{background:#0f172a;color:white;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;position:sticky;top:0;z-index:10}
header .top{display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{background:#1e293b;color:white;min-height:36px;padding:6px 12px}
.mnav b{font-size:16px;min-width:96px;text-align:center}
main{max-width:720px;margin:auto;padding:10px 10px calc(84px + env(safe-area-inset-bottom))}
.card{background:white;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
label{font-size:13px;color:#475569;display:block;margin:8px 0 4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:white;font-size:16px;color:#111827}
input[type=color]{padding:2px;height:40px}
input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:6px}
button{border:0;border-radius:10px;padding:9px 13px;min-height:42px;cursor:pointer;font-size:15px}
.primary{background:#0f172a;color:white}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}
.small{font-size:12px;color:#64748b}
.empty{text-align:center;color:#64748b;padding:24px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #e2e8f0;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;background:none;border-radius:0;font-size:12px;color:#64748b;padding:6px 0 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:#0f172a;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;background:#e2e8f0;color:#0f172a;border-radius:999px;min-height:36px;padding:6px 12px;font-size:14px;border:2px solid transparent}
.chip.on{background:#0f172a;color:white}
.brush{flex:none;border-radius:10px;min-height:40px;padding:6px 10px;font-size:14px;color:white;border:3px solid transparent}
.brush.on{border-color:#0f172a;box-shadow:0 0 0 2px white inset}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:12px;color:#64748b;padding:2px 0}
.cal .wd.sun,.cal .d.sun .n{color:#dc2626}.cal .wd.sat,.cal .d.sat .n{color:#2563eb}
.cal .d{background:#f8fafc;border-radius:8px;min-height:62px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:2px solid transparent;user-select:none;-webkit-user-select:none}
.cal .d.today{border-color:#f59e0b}
.cal .d.blank{background:none;cursor:default}
.cal .d .n{font-size:13px;font-weight:600;color:#334155}
.tag{font-size:12px;color:white;border-radius:6px;padding:1px 5px;max-width:100%;overflow:hidden;white-space:nowrap}
.ot{font-size:10px;color:#b45309;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
.cnt{font-size:11px;color:#475569}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#f1f5f9;border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:17px}.kpi small{font-size:11px;color:#64748b}
.emp-h{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.money{font-size:20px;font-weight:800;color:#0f172a}
table.br{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.br td{padding:4px 2px;border-bottom:1px solid #f1f5f9}
table.br td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.br tr.sum td{font-weight:800;border-bottom:0}
details summary{cursor:pointer;color:#2563eb;font-size:13px;margin-top:6px}
.daylist{font-size:13px;margin-top:6px}
.daylist div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #e2e8f0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.li:last-child{border-bottom:0}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:white;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));z-index:51;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility .22s;max-width:720px;margin:auto}
.sheet.show{transform:none;visibility:visible}
.sheet h2{font-size:17px;margin:0 0 6px}
.de{border:1px solid #e2e8f0;border-radius:12px;padding:8px;margin-top:8px}
.de .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.de .g label{margin:4px 0 2px;font-size:12px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:#e2e8f0;color:#0f172a;white-space:nowrap}.seg button.on{background:#0f172a;color:white;font-weight:700}
.step{display:flex;align-items:center;gap:8px}.step button{width:44px;background:#e2e8f0;font-size:20px;padding:0}.step b{min-width:28px;text-align:center;font-size:17px}
.ask{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);background:white;border-radius:16px;padding:16px;z-index:71;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ask.show{display:block}.ask p{margin:0 0 14px;font-size:16px;line-height:1.5;white-space:pre-wrap}.ask textarea{width:100%;min-height:120px;font-size:14px;margin-bottom:12px}
.line{background:#06c755;color:white;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;min-height:42px;padding:9px 13px;font-size:15px;border:0}
.pbig{font-size:17px;font-weight:800;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:white;padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.help li{margin:4px 0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>💰 薪資出勤</h1>
    <div class="mnav"><button id="prevM" aria-label="上個月">‹</button><b id="mLabel"></b><button id="nextM" aria-label="下個月">›</button></div>
  </div>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="cal"><span>📅</span>班表</button>
  <button data-tab="stat"><span>📊</span>統計</button>
  <button data-tab="emp"><span>👥</span>員工</button>
  <button data-tab="set"><span>⚙️</span>設定</button>
</nav>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="mask" id="askMask" style="z-index:70"></div>
<div class="ask" id="ask"></div>
<script>
const APP_VER='v5（2026-10-26）';
const KEY='salaryBoss.v1';
const OT_UNIT=0.5; // 加班一次＝0.5 工
const COLORS=['#2563eb','#7c3aed','#db2777','#0891b2','#ea580c','#65a30d','#0f766e','#9333ea'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const fu=n=>(Math.round(n*100)/100).toString();
const pad=n=>String(n).padStart(2,'0');
const dkey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const wLabel=w=>w===0.5?'½':w===1?'1':'';

function defaults(){return {ver:2,employees:[],records:{},settings:{cutoff:0}};}
// v1（班別、時薪／月薪）→ v2（工數、只算日薪）
function migrate(d){
  if(!d||typeof d!=='object')return defaults();
  if(d.ver>=2)return Object.assign(defaults(),d);
  const shifts=d.shifts||[];
  d.employees=(d.employees||[]).map(e=>({id:e.id,name:e.name,rate:num(e.rate),color:e.color,note:e.note||'',active:e.active!==false}));
  Object.keys(d.records||{}).forEach(k=>{
    const day=d.records[k];
    Object.keys(day).forEach(id=>{
      const r=day[id],sh=shifts.find(x=>x.id===r.s),out={};
      if(sh){const h=r.h!==undefined&&r.h!==''?num(r.h):num(sh.hours);out.w=h>0&&h<=4?0.5:1;}
      if(num(r.ot)>0)out.ot=1;
      ['add','sub','note'].forEach(f=>{if(r[f]!==undefined&&r[f]!=='')out[f]=r[f];});
      if(out.w||out.ot)day[id]=out;else delete day[id];
    });
    if(!Object.keys(day).length)delete d.records[k];
  });
  return {ver:2,employees:d.employees,records:d.records||{}};
}
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))||defaults();}catch(e){DB=defaults();}
DB=migrate(DB);DB.settings=Object.assign({cutoff:0},DB.settings);
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('⚠️ 無法儲存到這台裝置');}}
save();

const now=new Date();
const S={tab:'cal',y:now.getFullYear(),m:now.getMonth(),emp:'all',brush:'1',range:null};
try{const t=sessionStorage.getItem('salaryTab');if(t)S.tab=t;}catch(e){}

const $=id=>document.getElementById(id);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);}
function openSheet(html){$('sheet').innerHTML=html;$('mask').classList.add('show');$('sheet').classList.add('show');$('sheet').scrollTop=0;}
function closeSheet(){$('mask').classList.remove('show');$('sheet').classList.remove('show');}
$('mask').onclick=closeSheet;
// 確認框：ask('訊息',{ok:'刪除',danger:true}).then(ok=>…)；{text} 顯示可複製的文字
function ask(msg,o={}){
  return new Promise(res=>{
    const el=$('ask'),m=$('askMask');
    el.innerHTML=`<p>${esc(msg)}</p>${o.text!==undefined?`<textarea id="askText" readonly>${esc(o.text)}</textarea>`:''}<div class="row">${o.alert?'':'<button class="secondary grow" data-a="0">取消</button>'}<button class="${o.danger?'danger':'primary'} grow" data-a="1">${esc(o.ok||'確定')}</button></div>`;
    el.classList.add('show');m.classList.add('show');
    if($('askText'))$('askText').select();
    const done=v=>{el.classList.remove('show');m.classList.remove('show');res(v);};
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>done(b.dataset.a==='1'));
    m.onclick=()=>done(false);
  });
}

const activeEmps=()=>DB.employees.filter(e=>e.active!==false);
const empById=id=>DB.employees.find(e=>e.id===id);
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const k2d=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const d2k=t=>dkey(t.getFullYear(),t.getMonth(),t.getDate());
const addD=(k,n)=>{const t=k2d(k);t.setDate(t.getDate()+n);return d2k(t);};
const md=k=>{const t=k2d(k);return `${t.getMonth()+1}/${t.getDate()}`;};
const ymd=k=>{const t=k2d(k);return `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`;};
const todayKey=()=>d2k(new Date());

// ===== 薪資期間：結算日 cutoff（0＝月底）→ 第 y 年 m 月的薪資期間 =====
function period(y,m){
  const c=num(DB.settings.cutoff);
  if(!c)return {from:dkey(y,m,1),to:dkey(y,m,daysIn(y,m))};
  const pm=m?m-1:11,py=m?y:y-1;
  return {from:addD(dkey(py,pm,Math.min(c,daysIn(py,pm))),1),to:dkey(y,m,Math.min(c,daysIn(y,m)))};
}
const curPeriod=()=>S.range||period(S.y,S.m);
// 「每期從幾日到幾日」的選單；存的是 cutoff＝開始日−1（0＝1 日到月底）
function startSelect(id){
  const cur=num(DB.settings.cutoff)+1;
  return `<select id="${id}">${Array.from({length:29},(_,i)=>i+1).map(n=>`<option value="${n}" ${cur===n?'selected':''}>${n===1?'1 日 到 當月月底':`${n} 日 到 次月 ${n-1} 日`}</option>`).join('')}</select>`;
}
function bindStart(id){
  const el=$(id);if(!el)return;
  el.onchange=()=>{DB.settings.cutoff=num(el.value)-1;S.range=null;save();render();toast('已儲存薪資期間');};
}
const wdOf=k=>'日一二三四五六'[k2d(k).getDay()];
const periodDays=p=>Math.round((k2d(p.to)-k2d(p.from))/864e5)+1;

// ===== 日薪與調薪：e.rate＝起薪，e.raises＝[{from:'YYYY-MM-DD',rate}] =====
const raisesOf=e=>(e.raises||[]).slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
function rateOn(e,k){let v=num(e.rate);raisesOf(e).forEach(x=>{if(x.from<=k)v=num(x.rate);});return v;}

// ===== 薪資計算：每天的工數 × 當天的日薪（調薪後分段計算）=====
function calc(e,from,to){
  const r={days:0,work:0,otCount:0,ot:0,units:0,pay:0,add:0,sub:0,list:[],segs:[]};
  let seg=null;
  for(let k=from;k<=to;k=addD(k,1)){
    const rate=rateOn(e,k);
    if(!seg||seg.rate!==rate){seg={from:k,to:k,rate,units:0};r.segs.push(seg);}
    seg.to=k;
    const rec=(DB.records[k]||{})[e.id];if(!rec)continue;
    const w=num(rec.w),oc=num(rec.ot);
    if(w>0)r.days++;
    r.work+=w;r.otCount+=oc;r.add+=num(rec.add);r.sub+=num(rec.sub);seg.units+=w+oc*OT_UNIT;
    r.list.push({k,rec});
  }
  r.ot=r.otCount*OT_UNIT;r.units=r.work+r.ot;
  r.segs.forEach(g=>g.pay=Math.round(g.units*g.rate));
  r.pay=r.segs.reduce((a,g)=>a+g.pay,0);
  r.total=r.pay+r.add-r.sub;
  return r;
}
// 有工數的分段；全部同一個日薪時只有一段
const paySegs=r=>{const g=r.segs.filter(x=>x.units);return g.length?g:r.segs.slice(-1);};

// ===== 畫面 =====
function render(){
  const pl=S.tab==='stat'&&(S.range||num(DB.settings.cutoff));
  if(pl){const p=curPeriod();$('mLabel').textContent=`${md(p.from)}～${md(p.to)}`;}
  else $('mLabel').textContent=`${S.y}年${S.m+1}月`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  ({cal:renderCal,stat:renderStat,emp:renderEmp,set:renderSet})[S.tab]();
}
function shiftMonth(dm){S.range=null;S.m+=dm;if(S.m<0){S.m=11;S.y--;}if(S.m>11){S.m=0;S.y++;}render();}
$('prevM').onclick=()=>shiftMonth(-1);$('nextM').onclick=()=>shiftMonth(1);
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;try{sessionStorage.setItem('salaryTab',S.tab);}catch(e){}window.scrollTo(0,0);render();});

const BRUSHES=[
  {id:'1',name:'1 工',color:'#2563eb'},
  {id:'0.5',name:'0.5 工',color:'#0891b2'},
  {id:'ot',name:'＋加班 0.5 工',color:'#ea580c'},
  {id:'clr',name:'🧽 清除',color:'#94a3b8'},
  {id:'edit',name:'✏️ 詳細',color:'#475569'}
];
function renderCal(){
  const emps=activeEmps();
  if(S.emp!=='all'&&!emps.some(e=>e.id===S.emp))S.emp='all';
  if(!emps.length){$('view').innerHTML=`<div class="card empty">還沒有員工。<br><br><button class="primary" onclick="S.tab='emp';render();editEmp()">＋ 新增員工</button></div>`+helpCard();return;}
  let h=`<div class="card"><div class="chips"><button class="chip ${S.emp==='all'?'on':''}" data-emp="all">全部</button>`;
  emps.forEach(e=>h+=`<button class="chip ${S.emp===e.id?'on':''}" data-emp="${e.id}"><span class="dot" style="display:inline-block;background:${e.color};margin-right:4px;vertical-align:-1px"></span>${esc(e.name)}</button>`);
  h+='</div>';
  if(S.emp!=='all'){
    h+=`<div class="small" style="margin:8px 0 4px">選一個按鈕，再點日期記工（再點一次同樣的＝取消）：</div><div class="chips" style="flex-wrap:wrap">`;
    BRUSHES.forEach(k=>h+=`<button class="brush ${S.brush===k.id?'on':''}" style="background:${k.color}" data-brush="${k.id}">${k.name}</button>`);
    h+=`</div><div class="row" style="margin-top:8px"><button class="secondary grow" id="fillWk">平日空白日全記 1 工</button><button class="danger" id="clrM">清空本月</button></div>`;
  }else h+=`<div class="small" style="margin-top:6px">點日期可一次記所有員工當天的工數與加班。選上方員工可用按鈕快速記工。</div>`;
  h+='</div><div class="card"><div class="cal">';
  ['日','一','二','三','四','五','六'].forEach((w,i)=>h+=`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`);
  const first=new Date(S.y,S.m,1).getDay(),n=daysIn(S.y,S.m),tk=dkey(now.getFullYear(),now.getMonth(),now.getDate());
  for(let i=0;i<first;i++)h+='<div class="d blank"></div>';
  for(let d=1;d<=n;d++){
    const key=dkey(S.y,S.m,d),day=DB.records[key]||{},wd=(first+d-1)%7;
    let inner='';
    if(S.emp==='all'){
      const on=emps.filter(e=>day[e.id]);
      const units=on.reduce((a,e)=>a+num(day[e.id].w)+num(day[e.id].ot)*OT_UNIT,0);
      inner=`<div class="dots">${on.map(e=>`<i style="background:${e.color}"></i>`).join('')}</div>`+(units?`<div class="cnt">${fu(units)}工</div>`:'');
    }else{
      const rec=day[S.emp];
      if(rec&&num(rec.w))inner=`<div class="tag" style="background:${num(rec.w)===1?'#2563eb':'#0891b2'}">${wLabel(num(rec.w))} 工</div>`;
      if(rec&&num(rec.ot))inner+=`<div class="ot">+加${num(rec.ot)>1?'×'+num(rec.ot):''}</div>`;
      if(rec&&(num(rec.add)||num(rec.sub)||rec.note))inner+=`<div class="cnt">•</div>`;
    }
    h+=`<div class="d ${wd===0?'sun':wd===6?'sat':''} ${key===tk?'today':''}" data-day="${d}"><div class="n">${d}</div>${inner}</div>`;
  }
  h+='</div></div>';
  if(S.emp!=='all'){
    const e=empById(S.emp),p=period(S.y,S.m),r=calc(e,p.from,p.to);
    h+=`<div class="card"><div class="kpi"><div><b>${r.days}</b><small>出勤天數</small></div><div><b>${fu(r.units)}</b><small>總工數</small></div><div><b>${fmt(r.total)}</b><small>本期薪資</small></div></div><div class="small" style="margin-top:6px;text-align:center">薪資期間 ${ymd(p.from)}～${ymd(p.to)}</div></div>`;
  }
  $('view').innerHTML=h;
  document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{S.emp=b.dataset.emp;render();});
  document.querySelectorAll('[data-brush]').forEach(b=>b.onclick=()=>{S.brush=b.dataset.brush;render();});
  document.querySelectorAll('.cal .d[data-day]').forEach(c=>c.onclick=()=>tapDay(+c.dataset.day));
  if($('fillWk'))$('fillWk').onclick=fillWeekdays;
  if($('clrM'))$('clrM').onclick=clearMonth;
}
function clean(rec){
  if(!rec)return null;
  Object.keys(rec).forEach(k=>{if(rec[k]===''||rec[k]===0||rec[k]===undefined)delete rec[k];});
  return Object.keys(rec).length?rec:null;
}
function setRec(key,empId,rec){
  rec=clean(rec);
  DB.records[key]=DB.records[key]||{};
  if(rec)DB.records[key][empId]=rec;else delete DB.records[key][empId];
  if(!Object.keys(DB.records[key]).length)delete DB.records[key];
}
function tapDay(d){
  const key=dkey(S.y,S.m,d);
  if(S.emp==='all'||S.brush==='edit')return dayEditor(d);
  const cur=Object.assign({},(DB.records[key]||{})[S.emp]||{});
  if(S.brush==='clr')setRec(key,S.emp,null);
  else if(S.brush==='ot'){cur.ot=num(cur.ot)?0:1;setRec(key,S.emp,cur);}
  else{const w=num(S.brush);cur.w=num(cur.w)===w?0:w;setRec(key,S.emp,cur);}
  save();render();
}
function fillWeekdays(){
  let c=0;
  for(let d=1;d<=daysIn(S.y,S.m);d++){const wd=new Date(S.y,S.m,d).getDay();if(wd===0||wd===6)continue;
    const key=dkey(S.y,S.m,d);if((DB.records[key]||{})[S.emp])continue;setRec(key,S.emp,{w:1});c++;}
  save();render();toast(`已記 ${c} 天，每天 1 工`);
}
function clearMonth(){
  const e=empById(S.emp);
  ask(`清空 ${e.name} 在 ${S.y}年${S.m+1}月 的所有紀錄？`,{ok:'清空',danger:true}).then(ok=>{if(!ok)return;
    for(let d=1;d<=daysIn(S.y,S.m);d++)setRec(dkey(S.y,S.m,d),S.emp,null);
    save();render();toast('已清空');});
}
function dayEditor(d){
  const key=dkey(S.y,S.m,d),day=DB.records[key]||{};
  const emps=S.emp==='all'?activeEmps():[empById(S.emp)];
  const wd='日一二三四五六'[new Date(S.y,S.m,d).getDay()];
  let h=`<h2>${S.m+1}月${d}日（${wd}）</h2><div class="small">1 工＝1 天日薪；加班每次 0.5 工。</div>`;
  emps.forEach(e=>{
    const r=day[e.id]||{},w=num(r.w);
    h+=`<div class="de" data-e="${e.id}" data-w="${w}" data-ot="${num(r.ot)}"><div class="emp-h"><span class="dot" style="background:${e.color}"></span><b class="grow">${esc(e.name)}</b><span class="small">日薪 ${fmt(rateOn(e,key))}</span></div>
    <label>正班</label><div class="seg">${[[0,'沒上班'],[0.5,'0.5 工'],[1,'1 工']].map(([v,t])=>`<button type="button" data-wv="${v}" class="${w===v?'on':''}">${t}</button>`).join('')}</div>
    <label>加班（每次 0.5 工）</label><div class="step"><button type="button" data-otd="-1">−</button><b data-otn>${num(r.ot)}</b><button type="button" data-otd="1">＋</button><span class="small" data-otu>次＝${fu(num(r.ot)*OT_UNIT)} 工</span></div>
    <div class="g"><div><label>加給／獎金（元）</label><input data-f="add" type="number" inputmode="numeric" value="${esc(r.add??'')}" placeholder="0"></div>
    <div><label>預支／扣款（元）</label><input data-f="sub" type="number" inputmode="numeric" value="${esc(r.sub??'')}" placeholder="0"></div></div>
    <label>備註</label><input data-f="note" value="${esc(r.note??'')}" placeholder="例如：工地名稱"></div>`;
  });
  h+=`<div class="row" style="margin-top:12px"><button class="secondary grow" onclick="closeSheet()">取消</button><button class="primary grow" id="dSave">儲存</button></div>`;
  openSheet(h);
  document.querySelectorAll('#sheet .de').forEach(box=>{
    box.querySelectorAll('[data-wv]').forEach(b=>b.onclick=()=>{box.dataset.w=b.dataset.wv;box.querySelectorAll('[data-wv]').forEach(x=>x.classList.toggle('on',x===b));});
    const step=box.querySelector('.step');
    step.querySelectorAll('[data-otd]').forEach(b=>b.onclick=()=>{
      const v=Math.max(0,num(box.dataset.ot)+num(b.dataset.otd));box.dataset.ot=v;
      box.querySelector('[data-otn]').textContent=v;box.querySelector('[data-otu]').textContent=`次＝${fu(v*OT_UNIT)} 工`;
    });
  });
  $('dSave').onclick=()=>{
    document.querySelectorAll('#sheet .de').forEach(box=>{
      const rec={w:num(box.dataset.w),ot:num(box.dataset.ot)};
      box.querySelectorAll('[data-f]').forEach(i=>{const v=i.value.trim();if(v!=='')rec[i.dataset.f]=v;});
      setRec(key,box.dataset.e,rec);
    });
    save();closeSheet();render();toast('已儲存');
  };
}

function renderStat(){
  const p=curPeriod();

  let h=`<div class="card"><b>薪資期間</b>
  <div class="seg" style="margin-top:8px"><button type="button" data-pm="auto" class="${S.range?'':'on'}">每期固定日期</button><button type="button" data-pm="custom" class="${S.range?'on':''}">這次自訂</button></div>`;
  if(S.range)h+=`<div class="row" style="margin-top:8px"><input id="rgFrom" class="grow" type="date" value="${p.from}"><span>～</span><input id="rgTo" class="grow" type="date" value="${p.to}"></div>`;
  else h+=`<label for="stStart">每期從</label>${startSelect('stStart')}`;
  h+=`<div class="pbig">${ymd(p.from)}（${wdOf(p.from)}）～ ${ymd(p.to)}（${wdOf(p.to)}）</div>
  <div class="small">共 ${periodDays(p)} 天。${S.range?'只算這一次，換月份或切回「每期固定日期」就恢復。':'上方 ‹ › 切換上一期／下一期。'}</div></div>`;
  if(!emps.length){$('view').innerHTML=h+'<div class="card empty">還沒有員工資料。</div>';bindPeriod();return;}
  const rs=emps.map(e=>({e,r:calc(e,p.from,p.to)}));
  const tot=rs.reduce((a,x)=>a+x.r.total,0),un=rs.reduce((a,x)=>a+x.r.units,0),ot=rs.reduce((a,x)=>a+x.r.ot,0);
  h+=`<div class="card"><div class="kpi"><div><b>${fmt(tot)}</b><small>薪資總支出</small></div><div><b>${fu(un)}</b><small>總工數</small></div><div><b>${fu(ot)}</b><small>加班工數</small></div></div>
  <div class="row" style="margin-top:10px"><button class="secondary grow" id="csv">📄 匯出 Excel（CSV）</button><button class="secondary grow" id="cp">📋 複製總表</button></div></div>`;
  rs.forEach(({e,r})=>{
    const sg=paySegs(r);
    h+=`<div class="card"><div class="emp-h"><span class="dot" style="background:${e.color}"></span><b class="grow">${esc(e.name)}</b><span class="money">$${fmt(r.total)}</span></div>
    <div class="small" style="margin-top:4px">出勤 ${r.days} 天・正班 ${fu(r.work)} 工・加班 ${r.otCount} 次（${fu(r.ot)} 工）・共 ${fu(r.units)} 工${sg.length>1?'・<b style="color:#b45309">期間內有調薪</b>':''}</div>
    <table class="br">${sg.map(g=>`<tr><td>${sg.length>1?`${md(g.from)}～${md(g.to)}　`:''}${fu(g.units)} 工 × 日薪 ${fmt(g.rate)}</td><td>${fmt(g.pay)}</td></tr>`).join('')}
    <tr><td>加給／獎金</td><td>${fmt(r.add)}</td></tr><tr><td>預支／扣款</td><td>${r.sub?'−'+fmt(r.sub):0}</td></tr>
    <tr class="sum"><td>實發</td><td>${fmt(r.total)}</td></tr></table>
    <button class="line" style="width:100%;margin-top:8px" data-slip="${e.id}">💬 用 LINE 傳薪資單</button>
    <details><summary>每日明細（${r.list.length} 筆）</summary><div class="daylist">${r.list.map(({k,rec})=>`<div><span>${md(k)} ${num(rec.w)?fu(num(rec.w))+' 工':''}${num(rec.ot)?` 加班${num(rec.ot)}次`:''}${rec.note?`（${esc(rec.note)}）`:''}</span><span>${num(rec.add)?'+'+fmt(num(rec.add)):''}${num(rec.sub)?' −'+fmt(num(rec.sub)):''}</span></div>`).join('')||'<div>這段期間沒有紀錄</div>'}</div></details></div>`;
  });
  $('view').innerHTML=h;
  bindPeriod();
  $('csv').onclick=()=>exportCSV(rs,p);
  $('cp').onclick=()=>{
    const t=`${ymd(p.from)}～${ymd(p.to)} 薪資統計\n`+rs.map(({e,r})=>`${e.name}：出勤${r.days}天、共${fu(r.units)}工（加班${fu(r.ot)}工）、實發 ${fmt(r.total)} 元`).join('\n')+`\n合計：${fmt(tot)} 元`;
    copyText(t);
  };
  document.querySelectorAll('[data-slip]').forEach(b=>b.onclick=()=>{const x=rs.find(o=>o.e.id===b.dataset.slip);slipSheet(x.e,x.r,p);});
}
function bindPeriod(){
  bindStart('stStart');
  document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{S.range=b.dataset.pm==='custom'?Object.assign({},curPeriod()):null;render();});
  const f=$('rgFrom'),t=$('rgTo');if(!f)return;
  const upd=()=>{let a=f.value,b=t.value;if(!a||!b)return;if(a>b)[a,b]=[b,a];S.range={from:a,to:b};render();};
  f.onchange=upd;t.onchange=upd;
}
function copyText(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已複製'),()=>ask('請長按下面的文字複製：',{text:t,alert:true,ok:'關閉'}));
}
// ===== 薪資單（LINE 傳送）=====
function slipText(e,r,p,detail){
  const sg=paySegs(r),L=[];
  L.push(`【薪資單】${e.name}`,`期間：${ymd(p.from)}～${ymd(p.to)}`,'',`出勤：${r.days} 天`,`正班：${fu(r.work)} 工`,`加班：${r.otCount} 次（${fu(r.ot)} 工）`,`合計：${fu(r.units)} 工`,'');
  if(sg.length>1){L.push('工資（期間內調薪）：');sg.forEach(g=>L.push(`　${md(g.from)}～${md(g.to)}　${fu(g.units)} 工 × ${fmt(g.rate)} ＝ ${fmt(g.pay)}`));}
  else L.push(`工資：${fu(sg[0].units)} 工 × 日薪 ${fmt(sg[0].rate)} ＝ ${fmt(sg[0].pay)}`);
  if(r.add)L.push(`加給／獎金：＋${fmt(r.add)}`);
  if(r.sub)L.push(`預支／扣款：－${fmt(r.sub)}`);
  L.push(`實發：${fmt(r.total)} 元`);
  if(detail&&r.list.length){
    L.push('','— 每日明細 —');
    r.list.forEach(({k,rec})=>{
      const a=[];if(num(rec.w))a.push(`${fu(num(rec.w))} 工`);if(num(rec.ot))a.push(`加班${num(rec.ot)}次`);
      if(num(rec.add))a.push(`+${fmt(num(rec.add))}`);if(num(rec.sub))a.push(`−${fmt(num(rec.sub))}`);if(rec.note)a.push(rec.note);
      L.push(`${md(k)}（${'日一二三四五六'[k2d(k).getDay()]}）${a.join('　')}`);
    });
  }
  return L.join('\n');
}
function slipSheet(e,r,p){
  openSheet(`<h2>薪資單：${esc(e.name)}</h2>
  <label style="margin:6px 0"><input type="checkbox" id="slDetail" checked>附每日明細</label>
  <textarea id="slText" style="min-height:280px;font-size:15px;line-height:1.5"></textarea>
  <div class="small" style="margin:6px 0 10px">可以先修改內容。按「用 LINE 傳送」後，在 LINE 選擇要傳給 ${esc(e.name)} 的聊天室。</div>
  <div class="row"><button class="secondary" onclick="closeSheet()">關閉</button><button class="secondary grow" id="slCopy">📋 複製</button><a class="line grow" id="slLine" target="_blank" rel="noopener">💬 用 LINE 傳送</a></div>`);
  const ta=$('slText'),a=$('slLine');
  const link=()=>{a.href='https://line.me/R/share?text='+encodeURIComponent(ta.value);};
  const fill=()=>{ta.value=slipText(e,r,p,$('slDetail').checked);link();};
  fill();
  $('slDetail').onchange=fill;ta.oninput=link;
  $('slCopy').onclick=()=>copyText(ta.value);
}

function download(name,text,type){
  const blob=new Blob([text],{type});
  const file=typeof File!=='undefined'?new File([blob],name,{type}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportCSV(rs,p){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[[`薪資期間 ${ymd(p.from)}～${ymd(p.to)}`],['員工','日薪（分段）','出勤天數','正班工數','加班次數','加班工數','總工數','工資','加給','預支扣款','實發']];
  rs.forEach(({e,r})=>rows.push([e.name,paySegs(r).map(g=>`${md(g.from)}~${md(g.to)} ${fu(g.units)}工×${g.rate}`).join('；'),r.days,fu(r.work),r.otCount,fu(r.ot),fu(r.units),r.pay,r.add,r.sub,r.total]));
  rows.push([],['日期','員工','日薪','正班工數','加班次數','加給','預支扣款','備註']);
  rs.forEach(({e,r})=>r.list.forEach(({k,rec})=>rows.push([k,e.name,rateOn(e,k),num(rec.w)||'',num(rec.ot)||'',rec.add??'',rec.sub??'',rec.note??''])));
  download(`薪資出勤_${p.from}_${p.to}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

function renderEmp(){
  let h=`<div class="card"><button class="primary" style="width:100%" onclick="editEmp()">＋ 新增員工</button></div><div class="card">`;
  if(!DB.employees.length)h+='<div class="empty">還沒有員工</div>';
  DB.employees.forEach(e=>{const n=(e.raises||[]).length;
    h+=`<div class="li" data-id="${e.id}"><span class="dot" style="background:${e.color}"></span><div class="grow"><b>${esc(e.name)}</b>${e.active===false?' <span class="small">（已離職）</span>':''}<div class="small">目前日薪 ${fmt(rateOn(e,todayKey()))} 元${n?`・調薪 ${n} 次`:''}${e.note?'・'+esc(e.note):''}</div></div><span class="small">編輯 ›</span></div>`;});
  $('view').innerHTML=h+'</div>';
  document.querySelectorAll('.li[data-id]').forEach(li=>li.onclick=()=>editEmp(li.dataset.id));
}

function editEmp(id){
  const e=id?empById(id):{id:uid(),name:'',rate:'',raises:[],color:COLORS[DB.employees.length%COLORS.length],active:true};
  let rs=raisesOf(e).map(x=>({...x}));
  openSheet(`<h2>${id?'編輯員工':'新增員工'}</h2>
  <label>姓名</label><input id="eName" value="${esc(e.name)}" placeholder="例如：王小明">
  <div class="row"><div class="grow"><label>起薪：日薪（元，1 工的工資）</label><input id="eRate" type="number" inputmode="numeric" value="${esc(e.rate)}" placeholder="例如：2000"></div>
  <div style="width:80px"><label>顏色</label><input id="eColor" type="color" value="${e.color}"></div></div>
  <div class="de" style="margin-top:10px"><b>📈 調薪紀錄</b>
    <div class="small" style="margin:2px 0 6px">加薪時在這裡新增「從哪天開始、新日薪」。生效日以前的工數照舊日薪算，以後的用新日薪，統計會分段列出。</div>
    <div id="rsList"></div>
    <div class="row" style="margin-top:6px"><input id="rsFrom" class="grow" type="date" value="${todayKey()}"><input id="rsRate" class="grow" type="number" inputmode="numeric" placeholder="新日薪"><button class="secondary" id="rsAdd" type="button">＋ 新增</button></div>
  </div>
  <label>備註</label><input id="eNote" value="${esc(e.note||'')}" placeholder="電話、職稱…">
  <label style="margin-top:12px"><input type="checkbox" id="eAct" ${e.active!==false?'checked':''}>在職（取消勾選＝離職，不會出現在班表）</label>
  <div class="row" style="margin-top:12px">${id?'<button class="danger" id="eDel">刪除</button>':''}<button class="secondary grow" onclick="closeSheet()">取消</button><button class="primary grow" id="eSave">儲存</button></div>`);
  const draw=()=>{
    rs.sort((a,b)=>a.from<b.from?-1:1);
    $('rsList').innerHTML=rs.length?rs.map((x,i)=>`<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px dashed #e2e8f0"><span>${ymd(x.from)} 起　日薪 <b>${fmt(num(x.rate))}</b></span><button class="danger" type="button" style="min-height:34px;padding:4px 10px" data-rsdel="${i}">刪除</button></div>`).join(''):'<div class="small">還沒有調薪紀錄</div>';
    document.querySelectorAll('[data-rsdel]').forEach(b=>b.onclick=()=>{rs.splice(+b.dataset.rsdel,1);draw();});
  };
  draw();
  $('rsAdd').onclick=()=>{
    const f=$('rsFrom').value,v=num($('rsRate').value);
    if(!f||!v){toast('請填生效日和新日薪');return;}
    rs=rs.filter(x=>x.from!==f);rs.push({from:f,rate:v});$('rsRate').value='';draw();toast('已加入，記得按「儲存」');
  };
  $('eSave').onclick=()=>{
    const name=$('eName').value.trim();if(!name){toast('請輸入姓名');return;}
    Object.assign(e,{name,rate:num($('eRate').value),raises:rs,color:$('eColor').value,note:$('eNote').value.trim(),active:$('eAct').checked});
    if(!id)DB.employees.push(e);
    save();closeSheet();render();toast('已儲存');
  };
  if(id)$('eDel').onclick=()=>{
    ask(`刪除「${e.name}」以及他所有的紀錄？（只是離職的話，取消「在職」即可）`,{ok:'刪除',danger:true}).then(ok=>{if(!ok)return;
      DB.employees=DB.employees.filter(x=>x.id!==id);
      Object.keys(DB.records).forEach(k=>{delete DB.records[k][id];if(!Object.keys(DB.records[k]).length)delete DB.records[k];});
      if(S.emp===id)S.emp='all';
      save();closeSheet();render();toast('已刪除');});
  };
}

function renderSet(){
  let h=`<div class="card"><b>計算方式</b><div class="small" style="margin-top:4px;font-size:14px;color:#334155">每天記 <b>0.5 工</b> 或 <b>1 工</b>，每次加班 <b>＋0.5 工</b>。<br>薪資＝每天的工數 × 當天的日薪＋加給－預支／扣款（有調薪時分段計算）。</div></div>

    }catch(e){ask('檔案格式不正確，請選「⬇️ 匯出備份」存下來的 .json 檔。',{alert:true});}ev.target.value='';};
